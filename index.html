<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ff6b4a" />
  <meta name="description" content="家庭积分管理 — 任务积分、愿望兑换、全家成员切换" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="家庭积分" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-512.jpg" />
  <link rel="icon" href="icon-512.jpg" type="image/jpeg" />
  <title>家庭积分</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="home">
  <div class="app">
    <!-- ===== App Bar ===== -->
    <header class="app-bar">
      <div class="app-bar__title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08A1 1 0 0 0 2.6 7.9l8.58 3.9a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.82L12.83 2.18Z"/><path d="m2.6 12.08 8.58 3.9a2 2 0 0 0 1.66 0l8.58-3.9"/><path d="m2.6 17.08 8.58 3.9a2 2 0 0 0 1.66 0l8.58-3.9"/></svg>
        家庭积分
      </div>
      <div class="app-bar__right">
        <button class="app-bar__user-pill" id="appBarUser" type="button" aria-label="当前账号">
          <span class="app-bar__user-name" id="appBarUserName">—</span>
          <span class="app-bar__user-avatar av-1" id="appBarUserAvatar">🐻</span>
        </button>
        <button class="app-bar__icon-btn" id="appBarSettings" type="button" aria-label="设置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </header>

    <!-- ===== Main content (4 views; only .view--active is shown) ===== -->
    <main class="app-content">
      <section class="view view--active" data-view="home" id="view-home"></section>
      <section class="view" data-view="tasks" id="view-tasks"></section>
      <section class="view" data-view="rewards" id="view-rewards"></section>
      <section class="view" data-view="members" id="view-members"></section>
    </main>

    <!-- ===== FAB (context-aware per view) ===== -->
    <button class="fab" id="fab" type="button" aria-label="新增" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
    </button>

    <!-- ===== Tab Bar (frozen nav) ===== -->
    <nav class="tab-bar" aria-label="主导航">
      <button class="tab tab--active" data-tab="home" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M9 22V12h6v10"/></svg>
        <span>首页</span>
      </button>
      <button class="tab" data-tab="tasks" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h.01"/><path d="M3 18h.01"/><path d="M3 6h.01"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M8 6h13"/></svg>
        <span>任务</span>
      </button>
      <button class="tab" data-tab="rewards" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 12 20 22 4 22 4 12"/><rect width="20" height="5" x="2" y="7" rx="1"/><line x1="12" x2="12" y1="22" y2="7"/><line x1="12" x2="12" y1="22" y2="7" transform="rotate(12 12 12)"/><path d="M7.5 2C6.7 4 6 6 6 7.5a3 3 0 0 0 6 0C12 6 11.3 4 10.5 2"/></svg>
        <span>兑换</span>
      </button>
      <button class="tab" data-tab="members" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>成员</span>
      </button>
    </nav>
  </div>

  <!-- ===== Modal host (bottom sheet) ===== -->
  <div class="modal-overlay" id="modalOverlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" id="modal"></div>
  </div>

  <!-- ===== Toast host ===== -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- scripts: data → api → app (order matters) -->
  <script src="mock.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
  <script>
    // 注册 Service Worker（PWA 离线支持）
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
